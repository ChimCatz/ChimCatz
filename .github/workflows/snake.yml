# Draws the contribution calendar as an animated picture for the profile
# README. Runs once a day, and on demand from the Actions tab. The pictures
# are saved to a branch named "output"; the README shows them from there.
#
# This file goes in the profile repo at: .github/workflows/snake.yml
name: Contribution snake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Two versions in the site's purple palette: one for light pages, one for dark
      - name: Draw the pictures
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#7c3aed&color_dots=#ebedf0,#ddd6fe,#c4b5fd,#a78bfa,#7c3aed
            dist/snake-dark.svg?color_snake=#c4b5fd&color_dots=#161b22,#2e1a5c,#6d28d9,#7c3aed,#a78bfa

      - name: Save them to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
